<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#021c12" />
    <meta name="application-name" content="AUSSS" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AUSSS is the Ain Shams University Students' Scientific Society: the IFMSA society at the Faculty of Medicine, Ain Shams University, Cairo. Medical research, public health, medical education and student exchange since 1971. Life Savers, Change Makers."
    />
    <title>AUSSS, Ain Shams University Students' Scientific Society</title>
    <!-- Google Search Console ownership of ausss-ainshams.org, held by aussswebsite@gmail.com
         (needed for the OAuth consent-screen branding verification). Keep it. -->
    <meta name="google-site-verification" content="aHRb3kmpLcUm4CHOuDNy7NEUaaq9AteRSzzYef3uhQM" />

    <!-- Canonical / social. Production domain since 2026-09-19 (attached to the Vercel
         project; keep src/seo/pages.js and public/robots.txt in step with it). At build time
         scripts/prerender.mjs rewrites this block per page and generates sitemap.xml. -->
    <link rel="canonical" href="https://ausss-ainshams.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AUSSS" />
    <meta property="og:title" content="AUSSS, Ain Shams University Students' Scientific Society" />
    <meta
      property="og:description"
      content="AUSSS is the Ain Shams University Students' Scientific Society: the IFMSA society at the Faculty of Medicine, Ain Shams University, Cairo. Medical research, public health, medical education and student exchange since 1971. Life Savers, Change Makers."
    />
    <meta property="og:url" content="https://ausss-ainshams.org/" />
    <meta property="og:image" content="https://ausss-ainshams.org/assets/brand/ausss-horizontal-white.png" />
    <meta property="og:image:alt" content="AUSSS, Ain Shams University Students' Scientific Society" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AUSSS, Ain Shams University Students' Scientific Society" />
    <meta
      name="twitter:description"
      content="AUSSS is the Ain Shams University Students' Scientific Society: the IFMSA society at the Faculty of Medicine, Ain Shams University, Cairo. Medical research, public health, medical education and student exchange since 1971. Life Savers, Change Makers."
    />
    <meta name="twitter:image" content="https://ausss-ainshams.org/assets/brand/ausss-horizontal-white.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Hero logo is the LCP element on first paint, so fetch it early. -->
    <link rel="preload" as="image" href="/assets/brand/ausss-vertical-white.png" fetchpriority="high" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data so search engines understand the organisation (the pre-rendered
         pages carry a fuller record from src/seo/pages.js; this is the SPA-shell fallback). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Ain Shams University Students' Scientific Society",
        "alternateName": ["AUSSS", "AUSSS Ain Shams", "Ain Shams University Student Scientific Society", "IFMSA Ain Shams"],
        "url": "https://ausss-ainshams.org/",
        "logo": "https://ausss-ainshams.org/assets/brand/ausss-horizontal-white.png",
        "slogan": "Life Savers, Change Makers",
        "foundingDate": "1971",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "Ain Shams University, Faculty of Medicine"
        },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "38 Abbassia, next to Al-Nour Mosque",
          "addressLocality": "Cairo",
          "addressCountry": "EG"
        }
      }
    </script>
    <script>
      // No-flash theme bootstrap, runs before React mounts.
      // Reads explicit user choice from localStorage, falls back to OS preference.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = saved === 'dark' || (!saved && prefersDark)
          document.documentElement.classList.toggle('dark', isDark)
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
