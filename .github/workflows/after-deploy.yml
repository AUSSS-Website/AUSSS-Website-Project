# Runs when Vercel reports the result of a deployment (its GitHub integration
# posts a deployment status for every build).
#
# A production deploy that succeeded: tell Bing which pages changed through
# IndexNow (scripts/indexnow.mjs; the build wrote the list).
# A production deploy that failed: email the society inbox.
#
# Run it by hand (Actions > after-deploy > Run workflow) with "all" ticked to
# submit every URL in the sitemap, for example after rotating the key.
name: after-deploy

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every URL in the sitemap
        type: boolean
        default: false

permissions: {}

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The status arrives as the new build goes live; give the CDN a moment
      # so the list that is read is the new build's.
      - name: Wait for the deploy to settle
        if: github.event_name == 'deployment_status'
        run: sleep 45

      - name: Submit to IndexNow
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/indexnow.mjs --all
          else
            node scripts/indexnow.mjs
          fi

  deploy-failed:
    if: >-
      github.event_name == 'deployment_status' &&
      (github.event.deployment_status.state == 'failure' || github.event.deployment_status.state == 'error') &&
      startsWith(github.event.deployment.environment, 'Production')
    uses: ./.github/workflows/notify.yml
    with:
      subject: 'AUSSS website: the production deploy failed'
      body: >-
        Vercel could not build or publish the latest change to main, so the
        live site is still the previous version. Open the deployment in the
        Vercel dashboard to read the build log (RUNBOOK section 20).
    secrets:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
